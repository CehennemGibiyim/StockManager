name: Canlı site kontrolü

# Her push'ta canlı yayının ayakta ve güncel olduğunu kontrol eder.
# Build/deploy yapmaz; HTTP 200 ve canlı version.json sürümünü doğrular.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canlı site ayakta ve güncel mi (HTTP 200 ve sürüm)
        shell: bash
        timeout-minutes: 10
        env:
          PAGE_URL: https://cehennemgibiyim.github.io/StockManager/
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          expected_version=$(jq -r .version version.json)
          echo "Kontrol edilen adres: $PAGE_URL (beklenen sürüm: $expected_version)"
          for attempt in $(seq 1 15); do
            code=$(curl -sS -o /dev/null -L --max-time 15 --write-out '%{http_code}' "$PAGE_URL" || true)
            live_version=$(curl -sS -L --max-time 15 "${PAGE_URL%/}/version.json?v=$RUN_ID" | jq -r .version 2>/dev/null || true)
            echo "$attempt/15 deneme -> HTTP $code, canlı sürüm: ${live_version:-yok}"
            if [ "$code" = "200" ] && [ -n "$live_version" ] && [ "$live_version" = "$expected_version" ]; then
              echo "Canlı site yayında ve güncel: $PAGE_URL (HTTP 200, sürüm $live_version)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Canlı site beklenen durumda değil: $PAGE_URL HTTP 200 dönmedi ya da canlı sürüm '$expected_version' değil (site bayat kalmış olabilir)"
          exit 1
