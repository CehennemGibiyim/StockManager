name: Web sürümünü yayınla

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'main.js'
      - 'help.js'
      - 'src/**'
      - 'help/**'
      - 'locales/**'
      - 'assets/**'
      - 'vendor/**'
      - 'version.json'
      - 'scripts/build-web.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:js
      - run: node scripts/build-web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
