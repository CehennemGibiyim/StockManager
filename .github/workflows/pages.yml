name: Web sürümünü yayınla

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'main.js'
      - 'help.js'
      - 'src/**'
      - 'help/**'
      - 'locales/**'
      - 'assets/**'
      - 'vendor/**'
      - 'version.json'
      - 'scripts/build-web.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:js
      - run: node scripts/build-web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4

      # Dağıtım sonrası canlı sitenin gerçekten yayında olduğunu doğrular.
      # Not: yukarıdaki paths filtresi nedeniyle bu kontrol yalnızca site
      # dosyaları değiştiğinde (Pages workflow'u tetiklendiğinde) çalışır.
      - name: Canlı siteyi doğrula (HTTP 200, eksiksiz index.html, sürüm ve commit)
        shell: bash
        timeout-minutes: 10
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          expected_version=$(jq -r .version version.json)
          echo "Kontrol edilen adres: $PAGE_URL (beklenen sürüm: $expected_version, beklenen commit: ${EXPECTED_COMMIT:0:7})"
          for attempt in $(seq 1 15); do
            code=$(curl -sS -o /dev/null -L --max-time 15 --write-out '%{http_code}' "$PAGE_URL" || true)
            html=$(curl -sS -L --max-time 15 "$PAGE_URL" || true)
            live_version=$(curl -sS -L --max-time 15 "${PAGE_URL%/}/version.json" | jq -r .version 2>/dev/null || true)
            live_commit=$(curl -sS -L --max-time 15 "${PAGE_URL%/}/build.json?v=$RUN_ID" | jq -r .commit 2>/dev/null || true)
            echo "$attempt/15 deneme -> HTTP $code, index.html ${#html} bayt, canlı sürüm: ${live_version:-yok}, canlı commit: ${live_commit:-yok}"
            if [ "$code" = "200" ] && grep -q '</html>' <<< "$html" && [ -n "$live_version" ] && [ "$live_version" = "$expected_version" ] && [ "$live_commit" = "$EXPECTED_COMMIT" ]; then
              echo "Dağıtım doğrulandı: $PAGE_URL (HTTP 200, index.html ${#html} bayt, sürüm $live_version, commit ${EXPECTED_COMMIT:0:7})"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Dağıtım doğrulanamadı: $PAGE_URL HTTP 200 dönmedi, index.html boş/eksik ya da canlı build '${EXPECTED_COMMIT:0:7}' commit'ini / '$expected_version' sürümünü sunmuyor"
          exit 1
# GitHub Actions ile dist/web çıktısını yayınlar.
